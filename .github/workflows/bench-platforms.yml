name: bench platforms

# The leaderboards where people run them: a clean, non-editable install from the checkout on Linux, macOS (arm64)
# and Windows, following the README's graph-ad steps (torch 2.12.1 CPU build and its pyg-lib wheel), then the bench
# unit tests and the golden checks of three tasks that cover the graph rows, the LLM-judge caches and the PRE votes
# shipped in the package. Without --exact, a known platform value is accepted and any other difference fails.
# Weekly and on demand; bench-golden.yml is the Linux reference run of every task with --exact.
on:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

jobs:
  bench-platform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install torch, the pyg-lib backend, and the bench and graph-ad extras (README steps)
        env:
          TORCH_VERSION: "2.12.1"
        run: |
          python -m pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pyg_lib -f "https://data.pyg.org/whl/torch-${TORCH_VERSION}+cpu.html"
          python -m pip install ".[bench,graph-ad]" pytest
          python -m pip check
      - name: Check the sampling backend and that auditable is the installed copy
        run: |
          python -c "import torch_geometric.typing as t; assert t.WITH_PYG_LIB, 'pyg-lib did not register'"
          cd "$RUNNER_TEMP"
          python -c "import auditable, sys; assert 'site-packages' in auditable.__file__, auditable.__file__; print(sys.platform, auditable.__version__, auditable.__file__)"
      - name: Bench unit tests (no download) against the installed package
        run: |
          cp -r tests "$RUNNER_TEMP/tests"
          cp pyproject.toml "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python -m pytest -q -p no:cacheprovider tests/test_bench_*.py tests/test_methods_spline_size.py
      - name: Cache agentpile and Hugging Face corpora
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/agentpile
            ~/.cache/huggingface
          key: bench-corpora-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'src/auditable/bench/tasks/*.py', 'src/auditable/bench/corpora/*.py') }}
          restore-keys: |
            bench-corpora-${{ runner.os }}-
      - name: Golden checks of three tasks
        env:
          PYTHONHASHSEED: "0"
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: |
          cd "$RUNNER_TEMP"
          python -m auditable.bench detect/swegym localize/whoandwhen pre/over_privilege --golden
